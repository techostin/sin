name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  php:
    name: PHP 8.4 - testes e qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, openssl, fileinfo
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Testes
        run: composer test

      - name: PHPStan
        run: composer analyse

      - name: Deptrac
        run: composer deptrac

      - name: PHPCS
        run: composer lint
